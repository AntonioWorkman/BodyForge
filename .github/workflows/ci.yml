name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch makes an in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Matches the toolchain the project is developed against. The test
          # suite runs persistence tests against `node:sqlite`, which needs 22.
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  bundle:
    name: Native bundle
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # A type-correct app can still fail to bundle — a web-only import once
      # broke the native graph while every test stayed green. Exporting both
      # platforms catches that without needing a simulator.
      - name: Export iOS and Android bundles
        run: npx expo export --platform ios --platform android --output-dir dist-ci

      - name: Check bundles were produced
        run: |
          test -n "$(find dist-ci/_expo/static/js/ios -name '*.hbc' -print -quit)"
          test -n "$(find dist-ci/_expo/static/js/android -name '*.hbc' -print -quit)"
